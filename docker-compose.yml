services:
  eureka-server:
    build:
      context: ./eureka-server
    ports:
      - "8761:8761"

  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: pricing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pricing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
